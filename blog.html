<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diana — Blog</title>

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: radial-gradient(circle at top left, #ffe8ef 0, #f3e7f1 32%, #f5f0ff 68%, #f7f8fc 100%);
            color: #3f3a3a;
        }

        .top-bar {
            max-width: 1120px;
            margin: 18px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0, #f7c9d8 45%, #d99ec7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .brand-text {
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 0.08em;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-item {
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.9);
            color: #5f4a52;
            font-weight: 500;
            text-decoration: none;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.9);
            transform: translateY(-2px);
        }

        .page {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .entry {
            background: rgba(255,255,255,0.92);
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 22px 50px rgba(137,113,132,0.14);
        }

        .entry-date {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .entry-title {
            font-size: 18px;
            color: #b4687d;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .entry-text {
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<header class="top-bar">
    <div class="brand">
        <div class="brand-logo">DZ</div>
        <div class="brand-text">HR Portfolio · 2025</div>
    </div>

    <nav class="nav-links">
        <a href="index.html" class="nav-item">Home</a>
        <a href="hobby.html" class="nav-item">My Hobby</a>
        <a href="blog.html" class="nav-item">Blog</a>
    </nav>
</header>

<div class="page">

    <div class="entry">
        <div class="entry-date">Week 1</div>
        <div class="entry-title">Understanding Job Descriptions</div>
        <div class="entry-text">
            Today I learned how to break down job descriptions properly…  
            (Сюди можеш дописувати свої думки 👀)
        </div>
    </div>

    <div class="entry">
        <div class="entry-date">Week 2</div>
        <div class="entry-title">Rewriting HR Messages</div>
        <div class="entry-text">
            Practiced rewriting cold, unfriendly templates into human ones…  
        </div>
    </div>

</div>

</body>
</html>
